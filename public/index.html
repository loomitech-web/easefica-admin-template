<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@latest/css/materialdesignicons.min.css">
    
  </head>
  <style>

    ::-webkit-scrollbar {
        display: none!important;
    }

    .auth0-lock.auth0-lock .auth0-lock-header-bg {
      background: #0a7cb9!important;
    }

    .auth0-lock.auth0-lock .auth0-lock-header {
      text-align: left!important;
    }

    .auth0-lock.auth0-lock .auth0-lock-name {
      color:white;
      padding-left: 0px!important;
    }

    .auth0-lock.auth0-lock .auth0-lock-header-welcome  {
      margin-top: 48px;
      margin-left: 8px;
      margin-bottom: 8px;;
    }

    .auth0-lock-close-button {
      display: none!important;
    }

    #loading-wrapper {
      position: fixed;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
    }

    #loading-text {
      display: block;
      position: absolute;
      top: 50%;
      left: 50%;
      color: white;
      width: 100px;
      height: 30px;
      margin: -7px 0 0 -45px;
      text-align: center;
      font-family: 'PT Sans Narrow', sans-serif;
      font-size: 20px;
    }

    #loading-content {
      display: block;
      position: absolute;
      left: 50%;
      top: 50%;
      width: 64px;
      height: 64px;
      margin: -32px 0 0 -32px;
      border: 1px solid white;
    }

    #loading-content {
      border: 3px solid transparent;
      border-top-color: white;
      border-bottom-color: white;
      border-radius: 50%;
      -webkit-animation: loader 2s linear infinite;
      -moz-animation: loader 2s linear infinite;
      -o-animation: loader 2s linear infinite;
      animation: loader 2s linear infinite;
    }

    @keyframes loader {
      0% {
        -webkit-transform: rotate(0deg);
        -ms-transform: rotate(0deg);
        transform: rotate(0deg);
      }

      100% {
        -webkit-transform: rotate(360deg);
        -ms-transform: rotate(360deg);
        transform: rotate(360deg);
      }
    }
    </style>

  <body style="background:#0875b8; background-image:url('/img/background.jpg');background-repeat: no-repeat; background-attachment: fixed; background-size: 100%;">
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app">
      <div id="loading-text"></div>
      <div id="loading-content"></div>
    </div>
    <!-- built files will be auto injected -->
  </body>
</html>
